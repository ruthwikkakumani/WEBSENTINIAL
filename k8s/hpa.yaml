apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websentinel-core
  namespace: websentinel
  labels:
    app.kubernetes.io/name: websentinel-core
    app.kubernetes.io/part-of: websentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websentinel-core
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 200Mi
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60