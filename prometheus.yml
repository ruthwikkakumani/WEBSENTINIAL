# WebSentinel — Prometheus scrape configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'websentinel'

scrape_configs:
  - job_name: 'websentinel-core'
    metrics_path: /metrics
    static_configs:
      - targets: ['core:8080']
        labels:
          service: 'core'

  - job_name: 'websentinel-rdap'
    metrics_path: /metrics
    static_configs:
      - targets: ['rdap:8082']
        labels:
          service: 'rdap'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']